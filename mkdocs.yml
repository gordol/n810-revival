site_name: N810 revival
site_url: https://gordol.github.io/n810-revival/
site_description: Debian and Pocket on the Nokia N810
docs_dir: docs
exclude_docs: |
  AGENTS.md
site_dir: site
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to night colors
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to day colors
  features:
  - content.code.copy
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- tables
- pymdownx.highlight:
    anchor_linenums: true
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true
extra_css:
- assets/stylesheets/project.css
- assets/stylesheets/home.css
extra_javascript:
- assets/javascripts/home.js
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
