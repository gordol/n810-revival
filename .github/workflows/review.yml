name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: n810-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          from pathlib import Path

          title = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["pull_request"]["title"]
          pattern = r"(?:feat|fix|build|chore|ci|docs|perf|refactor|revert|style|test)(?:\([a-zA-Z0-9_./-]+\))?!?: \S[^\r\n]*"
          if not re.fullmatch(pattern, title):
              raise SystemExit("Use a Conventional Commit PR title, such as fix(launcher): handle process exit. See CONTRIBUTING.md.")
          PYCODE
      - name: Install pinned documentation dependencies outside the checkout
        run: make docs-install DOCS_ENV="$RUNNER_TEMP/n810-docs-env"
      - name: Check publication inputs, source links, and strict site build
        run: make docs-check DOCS_ENV="$RUNNER_TEMP/n810-docs-env"

  pocket-smoke:
    name: n810-pocket-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Run focused host checks
        run: make pocket-smoke
