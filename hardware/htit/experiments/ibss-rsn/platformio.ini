[platformio]
src_dir = .

[env:htit-ibss-ccmp-selftest]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_upload.flash_size = 8MB
monitor_speed = 115200
build_src_filter = +<ccmp.cpp> +<crypto_mbedtls.cpp> +<selftest.cpp>
build_flags = -Wall -Wextra

[env:htit-ibss-ccmp-radio-probe]
extends = env:htit-ibss-ccmp-selftest
build_src_filter = +<ccmp.cpp> +<crypto_mbedtls.cpp> +<radio_probe.cpp>
extra_scripts = post:pio_raw_patch.py

; Failed normal-MAC receive hypothesis, retained only for reproducible lab work.
; This is deliberately separate from the previously passing alias probe.
[env:htit-ibss-ccmp-rx-diagnostic]
extends = env:htit-ibss-ccmp-radio-probe
custom_rx_descriptor_gate = yes

[env:htit-ibss-ccmp-rx-observer]
extends = env:htit-ibss-ccmp-radio-probe
build_src_filter = +<ccmp.cpp> +<crypto_mbedtls.cpp> +<radio_probe.cpp> +<rx_observer.cpp>
build_flags = -Wall -Wextra -DHTIT_RX_OBSERVER
custom_rx_observer = yes

[env:htit-ibss-rsn-radio]
extends = env:htit-ibss-ccmp-rx-observer
build_src_filter = +<ccmp.cpp> +<crypto_mbedtls.cpp> +<radio_probe.cpp> +<rx_observer.cpp> +<tx_selector.cpp>
build_flags = -Wall -Wextra -DHTIT_RX_OBSERVER -DHTIT_TX_SELECTOR
custom_tx_selector = yes

[env:htit-ibss-rsn-selftest]
extends = env:htit-ibss-ccmp-selftest
build_src_filter = +<rsn_selftest.cpp>
extra_scripts = post:pio_rsn.py

[env:htit-ibss-rsn-link]
extends = env:htit-ibss-rsn-radio
build_src_filter = +<ccmp.cpp> +<crypto_mbedtls.cpp> +<rsn_radio.cpp> +<rx_observer.cpp> +<tx_selector.cpp>
build_flags = -Wall -Wextra -DHTIT_RX_OBSERVER -DHTIT_TX_SELECTOR -DHTIT_RSN_LINK -DARDUINO_LOOP_STACK_SIZE=16384
extra_scripts = post:pio_raw_patch.py
                post:pio_rsn.py
custom_rsn_auth = yes
custom_rsn_debug = yes
