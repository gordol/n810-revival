# Nokia N810 keyboard backlight policy.
keyboard_hold_seconds=60
keyboard_fade_seconds=10
# Fade stops at the configured floor while open, then off at extended idle.
keyboard_idle_seconds=300
# Re-sample ambient light and battery state while illuminated.
keyboard_sample_seconds=2
keyboard_min_brightness=56
keyboard_max_brightness=160
# Above this, ambient light makes keyboard illumination unnecessary. Set 0 to disable.
keyboard_off_lux=200
