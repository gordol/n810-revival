# Optional LCD ambient policy. The service is installed disabled.
lcd_sample_seconds=5
lcd_default_brightness=24
lcd_dark_lux=5
lcd_indoor_lux=50
lcd_bright_lux=200
lcd_dark_percent=45
lcd_indoor_percent=65
lcd_bright_percent=85
# Transflective sunlight mode: backlight off above this threshold and back on
# below the lower threshold. Set off to 0 to disable after hardware calibration.
lcd_sunlight_off_lux=5000
lcd_sunlight_on_lux=4000
