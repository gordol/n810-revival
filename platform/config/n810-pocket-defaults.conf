# N810 pocket desktop defaults. This file contains no credentials.
package_profile=connected
notifications=on
notification_color=blue
# Zero keeps text/tmux notices but suppresses the LED request.
notification_seconds=5
brightness=24
blank_minutes=5
windows=home,net,power

# Local tty1 session after login; SSH remains a normal shell.
session=pocket

# Graphical session flavor; plain TTY and pocket sessions are independent.
desktop=n810
