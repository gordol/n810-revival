<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>N810 pocket</title><link rel="stylesheet" href="/xterm.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101a17;color:#e3eee8;font:15px system-ui}header{padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{font:inherit;min-height:44px;background:#293d33;color:#eef7f0;border:1px solid #688473}button{font:inherit;color:#eef7f0;background:#293d33;border:1px solid #688473;border-radius:8px;min-height:44px;padding:8px 14px;touch-action:manipulation}button:active{background:#547662}#viewport{overflow:auto;max-width:100vw;background:#080e0b}#terminal{width:850px;height:486px;padding:3px}.controls{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.dpad{display:grid;grid-template-columns:repeat(3,48px);gap:4px}.dpad button{padding:6px}#status{white-space:pre-wrap;font:13px monospace;margin:10px}small{color:#adc4b6}.xterm{touch-action:pan-x pan-y}
</style></head><body><header><strong>N810 pocket</strong><label>View <select id="workspace"><option value="pocket">Shared device console</option></select></label><button id="new-view">New independent view</button><span id="connection">Connecting…</span><button id="reconnect">Reconnect</button><button id="keyboard">Keyboard</button><button id="screen">Phone fullscreen</button><button id="refresh">Power / network</button></header><div id="viewport"><div id="terminal"></div></div><div class="controls"><div class="dpad"><span></span><button data-key="up">↑</button><span></span><button data-key="left">←</button><button data-key="enter">OK</button><button data-key="right">→</button><span></span><button data-key="down">↓</button></div><div><div class="controls"><button data-key="menu">Menu</button><button data-key="home">Last tab</button><button data-key="full">Pane fullscreen</button><button data-key="prev">Previous tab</button><button data-key="next">Next tab</button></div><div class="controls"><button data-key="esc">Esc / Back</button><button data-key="tab">Tab</button><button data-key="plus">Map +</button><button data-key="minus">Map −</button><button data-key="fit">Map fit</button><button data-key="packets">Packets</button><button data-key="inspect">Inspect</button></div></div></div><small><span id="view-note">Shared console: tab changes also appear on the N810.</span> Fixed 100×30 cells. Map buttons send APRS keys; use them in the map tab. No power or radio controls.</small><pre id="status">Power and network: tap to read.</pre><script src="/xterm.js"></script><script src="/app.js"></script></body></html>
