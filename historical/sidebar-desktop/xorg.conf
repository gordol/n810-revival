Section "Module"
    Disable "glx"
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "N810 framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
    Identifier "N810 LCD"
    Device "N810 framebuffer"
    DefaultDepth 16
EndSection
Section "ServerLayout"
    Identifier "N810 pocket"
    Screen "N810 LCD"
    InputDevice "N810 remapped keyboard" "CoreKeyboard"
    InputDevice "N810 touchscreen" "CorePointer"
EndSection
Section "InputDevice"
    Identifier "N810 remapped keyboard"
    Driver "evdev"
    Option "Device" "@KEYBOARD_DEVICE@"
EndSection
Section "InputDevice"
    Identifier "N810 touchscreen"
    Driver "evdev"
    Option "Device" "@TOUCH_DEVICE@"
    Option "EmulateThirdButton" "true"
    Option "EmulateThirdButtonTimeout" "700"
    Option "EmulateThirdButtonMoveThreshold" "60"
    Option "TransformationMatrix" "@TOUCH_MATRIX@"
EndSection

# Static devices above keep the internal remapper and touch calibration.
# Ignore their automatic duplicates, including the raw hardware buttons.
Section "InputClass"
    Identifier "N810 static input duplicates"
    MatchProduct "Internal keyboard|N810 internal keyboard|TSC2005 touchscreen|retu-pwrbutton|gpio-keys"
    Option "Ignore" "true"
EndSection
Section "InputClass"
    Identifier "External keyboards"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection
Section "InputClass"
    Identifier "External pointers"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection
